name: run-season

# ── cadence: edit this ONE line to change schedule ──
# Mon + Thu 06:00 UTC
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      season:
        default: "2025"

env:
  SEASON: ${{ github.event.inputs.season || '2025' }}  # bump each August

jobs:
  seasons:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # serialize: parallel FBref scraping trips their IP block
      matrix:
        league:
          - "ENG-Premier League"
          - "ESP-La Liga"
          - "GER-Bundesliga"
          - "ITA-Serie A"
          - "FRA-Ligue 1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "Soccer Data Hub"
      - name: run pipeline (current season force-refetch)
        working-directory: Soccer Data Hub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEAGUE: ${{ matrix.league }}
        run: |
          python -c "
          import os
          from soccerhub import run_season
          m = run_season(os.environ['LEAGUE'], os.environ['SEASON'], force=True)
          print(m)
          "

  transfers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "Soccer Data Hub"
      - name: refresh transfers table
        working-directory: Soccer Data Hub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          from soccerhub import push_transfers
          print(push_transfers(force=True))
          "

  matches:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        league:
          - "ENG-Premier League"
          - "ESP-La Liga"
          - "GER-Bundesliga"
          - "ITA-Serie A"
          - "FRA-Ligue 1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "Soccer Data Hub"
      - name: refresh match results (plain CSV — no scraping, safe in parallel)
        working-directory: Soccer Data Hub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEAGUE: ${{ matrix.league }}
        run: |
          python -c "
          import os
          from soccerhub import push_matches
          print(push_matches(os.environ['LEAGUE'], os.environ['SEASON'], force=True))
          "

  club-elo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "Soccer Data Hub"
      - name: snapshot today's club Elo ratings
        working-directory: Soccer Data Hub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          from soccerhub import push_club_elo
          print(push_club_elo(force=True))
          "

  age-curve:
    needs: seasons  # derived from player_season — run after it refreshes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "Soccer Data Hub"
      - name: rebuild age_curve table
        working-directory: Soccer Data Hub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # read side of the job; this key is public by design (shipped in site JS)
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_Qy0bJ4CdrxffuJGNq12ebw_r0-Z3qD-"
        run: |
          python -c "
          from soccerhub import push_age_curve
          print(push_age_curve())
          "
