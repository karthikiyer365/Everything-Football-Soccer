<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Dashboard — SoccerHub</title>
<meta name="description" content="One page per player: technical profile, value vs output, and career trend, ranked against positional peers.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
  /* merged :root — player.html had no --red although player.html:460 used it */
  :root{
    --grass:#122b1a; --grass-lt:#16321f; --card:#0a1a0e;
    --line:#f2f5ef; --muted:#9fb69c; --tag:#8fae8b; --border:rgba(242,245,239,.22);
    --amber:#ffb43a; --green:#8fd18a; --chalk-y:#e8d47a; --blue:#5aa9f0;
    --red:#e0524a; --grid:rgba(242,245,239,.10); --axis:rgba(242,245,239,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:
       repeating-linear-gradient(0deg,var(--grass) 0 72px,var(--grass-lt) 72px 144px);
       color:var(--line);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
       min-height:100vh}
  .disp{font-family:"Avenir Next Condensed","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
        text-transform:uppercase;letter-spacing:.04em;font-stretch:condensed}
  .nums{font-variant-numeric:tabular-nums}
  a{color:var(--chalk-y)}

  /* ---------- nav + search ---------- */
  .top{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;
       padding:12px 20px;background:rgba(5,14,8,.92);backdrop-filter:blur(4px);
       border-bottom:1px solid var(--border)}
  .top a.home{color:var(--line);text-decoration:none;font-size:1.05rem;white-space:nowrap}
  .searchwrap{position:relative;flex:1;max-width:440px}
  #search{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--border);
       background:var(--card);color:var(--line);font:inherit;font-size:.95rem}
  #search::placeholder{color:var(--tag)}
  #search:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  #results{position:absolute;top:110%;left:0;right:0;background:var(--card);
       border:1px solid var(--border);border-radius:6px;overflow:hidden auto;display:none;
       max-height:320px;z-index:7}
  #results button{display:flex;justify-content:space-between;gap:12px;width:100%;
       padding:10px 14px;border:0;background:none;color:var(--line);font:inherit;
       font-size:.9rem;text-align:left;cursor:pointer}
  #results button:hover,#results button:focus-visible{background:rgba(255,180,58,.12);outline:none}
  #results .sub{color:var(--tag);font-size:.8rem;white-space:nowrap}

  main{max-width:1560px;margin:0 auto;padding:24px 20px 80px}
  .empty{color:var(--muted);text-align:center;padding:80px 20px;max-width:46ch;margin:0 auto}
  .empty .disp{color:var(--line);font-size:1.6rem}

  /* ---------- hero strip (flattened .pcard) ---------- */
  .herostrip{border-radius:14px;padding:18px 24px;
        background:linear-gradient(160deg,#2a4d2f 0%,#17331e 55%,#0e2413 100%);
        border:1px solid rgba(255,180,58,.55);
        box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
        display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .rating{text-align:center;min-width:74px}
  .rating b{display:block;font-size:46px;line-height:.9;color:var(--amber)}
  .rating span{font-size:9.5px;letter-spacing:.12em;color:var(--chalk-y)}
  .idbox{min-width:250px}
  .idbox h1{margin:0;font-size:30px;line-height:.95}
  .idbox p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
  .verdictwrap{display:flex;flex-direction:column;gap:6px}
  .chip{color:#0e2413;font-weight:800;padding:6px 14px;border-radius:999px;
        font-size:13px;letter-spacing:.08em;text-align:center}
  .verdictwrap small{color:var(--muted);font-size:11px}
  .facts{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;
         text-align:center;border-left:1px solid rgba(242,245,239,.15);padding-left:24px}
  .facts label{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .facts b{font-size:18px}
  @media(max-width:1100px){.facts{grid-template-columns:repeat(3,minmax(0,1fr));border-left:0;padding-left:0}}
  /* the old Game profile box, collapsed to one justified line in the strip */
  .gameline{flex-basis:100%;display:flex;flex-wrap:wrap;justify-content:space-between;
       gap:6px 18px;margin:14px 0 0;padding-top:12px;
       border-top:1px solid rgba(242,245,239,.15);font-size:13px}
  .gameline i{font-style:normal;color:var(--muted);letter-spacing:.08em;
       text-transform:uppercase;font-size:9.5px;margin-right:4px}
  .cardnote{margin:10px 0 0;font-size:11.5px;color:var(--muted)}
  .warn{color:var(--chalk-y);cursor:help}

  /* ---------- season chips ---------- */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
  .chips button{border:1px solid var(--border);background:var(--card);color:var(--muted);
       border-radius:999px;padding:4px 12px;font:inherit;font-size:.8rem;cursor:pointer}
  .chips button[aria-pressed="true"]{background:var(--amber);color:#20160a;
       border-color:var(--amber);font-weight:700}
  .chips button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

  /* ---------- tab bar ---------- */
  .tabs{display:flex;align-items:stretch;margin:18px 0 0;border-bottom:1px solid var(--border)}
  .tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:.82rem;
       letter-spacing:.1em;text-transform:uppercase;padding:12px 22px;cursor:pointer;
       border-radius:6px 6px 0 0}
  .tabs button[aria-selected="true"]{background:var(--amber);color:#20160a;font-weight:700}
  .tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
  #tabbody{padding-top:22px;display:flex;flex-direction:column;gap:22px}

  /* ---------- shared box ---------- */
  .box{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px}
  .box h2{margin:0 0 10px;font-size:.8rem;letter-spacing:.16em;
        text-transform:uppercase;color:var(--tag);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .box h2 .plain{color:var(--muted);letter-spacing:0;text-transform:none}
  .box p.cap{margin:10px 0 0;font-size:12px;color:var(--muted)}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
  .chartbox{position:relative}
  .chartbox svg{width:100%;height:auto;display:block}
  svg text{font:10px system-ui;fill:var(--axis)}
  #tip{position:fixed;z-index:9;pointer-events:none;display:none;background:#050e08;
       border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-size:.8rem;
       color:var(--line);box-shadow:0 4px 16px rgba(0,0,0,.5);max-width:230px}
  #tip .t{color:var(--tag);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}

  /* ---------- technical tab: xG band chips + shot map ---------- */
  .bandchips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .band{border:1px solid var(--border);background:rgba(242,245,239,.03);color:var(--muted);
       border-radius:8px;padding:6px 11px;font:inherit;font-size:.78rem;cursor:pointer;
       display:flex;flex-direction:column;gap:1px;min-width:82px}
  .band .lab{letter-spacing:.04em}
  .band .pc{font-size:15px;font-weight:700;color:var(--line);font-variant-numeric:tabular-nums}
  .band[aria-pressed="true"]{border-color:var(--amber);background:rgba(255,180,58,.12)}
  .band:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

  /* ---------- technical tab: radar + axis lists ---------- */
  /* shot map beside the radar. The radar side carries a 260px axis list too,
     so it gets the larger share — the pitch itself never exceeds 520px. */
  /* equal-height columns: both graph wells are GRAPH_H tall, SVGs scale inside */
  .techduo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
       gap:22px;align-items:stretch}
  @media(max-width:1280px){.techduo{grid-template-columns:1fr}}
  .techduo > .box{display:flex;flex-direction:column}
  .graphwell{height:500px;display:flex;align-items:center;justify-content:center}
  .graphwell svg{width:100%;height:100%;display:block}
  .box.techprofile{container-type:inline-size}
  .profile{display:grid;grid-template-columns:1fr 218px;gap:14px;align-items:start;margin-top:10px}
  /* the radar now sits in a column, so this switches on the BOX width, not the viewport */
  @container (max-width:660px){.profile{grid-template-columns:1fr}}
  .pizzawrap{text-align:center}
  .pizzawrap .chartbox{margin:0 auto}
  .pzlegend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
       margin-top:8px;font-size:12px}
  .pzlegend .i{display:flex;gap:6px;align-items:center;color:var(--muted)}
  .pzlegend .swatch{border-radius:50%}
  .cmpbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .cmpchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);
       border-radius:999px;padding:4px 8px 4px 11px;font-size:.82rem}
  .cmpchip .swatch{width:9px;height:9px;border-radius:50%}
  .cmpchip button{border:0;background:rgba(242,245,239,.12);color:var(--line);border-radius:50%;
       width:17px;height:17px;line-height:1;font-size:11px;cursor:pointer}
  .cmpsearch{position:relative}
  #cmpq{width:190px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);
       background:rgba(242,245,239,.04);color:var(--line);font:inherit;font-size:.82rem}
  #cmpq:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  #cmpresults{position:absolute;top:112%;left:0;width:240px;background:var(--card);z-index:7;
       border:1px solid var(--border);border-radius:6px;overflow:hidden auto;display:none;max-height:260px}
  #cmpresults button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:7px 12px;
       border:0;background:none;color:var(--line);font:inherit;font-size:.85rem;text-align:left;cursor:pointer}
  #cmpresults button:hover{background:rgba(255,180,58,.12)}
  #cmpresults .sub{color:var(--tag);font-size:.78rem}
  .axlist.cmp .r{grid-template-columns:1fr repeat(var(--np,2),42px)}
  .axlist.cmp .r.head b{font-size:10px}
  .axgroup{margin-bottom:14px}
  .axgroup h3{margin:0 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
       display:flex;gap:7px;align-items:center}
  .axgroup h3 .swatch{border-radius:50%}
  .axlist{font-size:11.5px}
  .axlist .r{display:grid;grid-template-columns:minmax(0,1fr) 44px 26px;gap:4px;padding:3px 0;
       border-top:1px solid rgba(242,245,239,.07)}
  .axlist .r span:first-child{color:var(--muted)}
  .axlist .r .raw{text-align:right;color:var(--muted)}
  .axlist .r b{text-align:right}

  .stub{color:var(--muted);font-size:.9rem;padding:26px 16px;text-align:center;
       border:1px dashed var(--border);border-radius:6px}
</style>
</head>
<body>
<nav class="top">
  <a class="home disp" href="index.html">⚽ SoccerHub</a>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Search any player, 2008–2025…"
           autocomplete="off" aria-label="Search player">
    <div id="results" role="listbox"></div>
  </div>
</nav>

<main id="main">
  <div class="empty" id="empty">
    <p class="disp">Pick a player</p>
    <p>Search 49,692 player-seasons across the Premier League, La Liga, Bundesliga,
       Serie A and Ligue 1 — 2008 to today.</p>
  </div>
</main>
<div id="tip" role="status"></div>

<script>
const SUPABASE_URL = "https://rgnzemkdldohplwbxxwy.supabase.co";
const ANON_KEY = "sb_publishable_Qy0bJ4CdrxffuJGNq12ebw_r0-Z3qD-";
const AGENT_ENDPOINT = "/api/ask"; // Netlify proxies this to the Render backend
const MIN_MINUTES = 450;      // pipeline nulls rates below this — same floor here
const VERDICT_GAP = 15;       // |output pct − value pct| beyond this = not "fair"
const XG_SINCE = 2014;        // Understat coverage starts 2014-15
const MIN_90S_PEER = 10;      // ~900 minutes before a peer can be ranked (radar pool)
const MIN_SHOTS_MAP = 20;     // below this a shot map is anecdote, not pattern

async function hub(table, params){
  const q = new URLSearchParams(params);
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${q}`,
                        {headers:{apikey: ANON_KEY}});
  if(!r.ok) throw new Error(`${table}: ${r.status}`);
  return r.json();
}
// Supabase caps every response at 1000 rows regardless of limit
async function hubAll(table, params){
  const PAGE = 1000, rows = [];
  for(let offset = 0;; offset += PAGE){
    const page = await hub(table, {...params, limit:String(PAGE), offset:String(offset)});
    rows.push(...page);
    if(page.length < PAGE) return rows;
  }
}

const eur = v => v==null ? "—" :
  v >= 1e6 ? `€${(v/1e6).toFixed(v>=10e6?0:1)}M` : `€${Math.round(v/1e3)}k`;
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tipEl = () => document.getElementById("tip");
const showTip = (e, html) => { const t=tipEl(); t.innerHTML=html; t.style.display="block";
  t.style.left=Math.min(e.clientX+14, innerWidth-244)+"px"; t.style.top=(e.clientY+14)+"px"; };
const hideTip = () => tipEl().style.display="none";

/* ---------- search (player.html contract — every season, not just 2014+) ---------- */
const box = document.getElementById("search");
const list = document.getElementById("results");
let deb;
box.addEventListener("input", () => {
  clearTimeout(deb);
  const q = box.value.trim();
  if(q.length < 3){ list.style.display = "none"; return; }
  deb = setTimeout(() => runSearch(q), 300);
});
document.addEventListener("click", e => {
  if(!e.target.closest(".searchwrap")) list.style.display = "none";
});

async function runSearch(q){
  const found = await hub("player_season", {
    select: "player_name,tm_id,team,season,league",
    player_name: `ilike.*${q}*`, order: "season.desc", limit: "60"});
  const seen = new Set(); const picks = [];
  for(const r of found){
    const key = r.tm_id ?? `name:${r.player_name}`;
    if(seen.has(key)) continue;
    seen.add(key); picks.push(r);
    if(picks.length === 8) break;
  }
  list.innerHTML = picks.length ? "" : "<button disabled>No players found</button>";
  for(const p of picks){
    const b = document.createElement("button");
    b.setAttribute("role","option");
    b.innerHTML = `<span>${esc(p.player_name)}</span>
       <span class="sub">${esc(p.team)} · ${esc(p.season)}</span>`;
    b.onclick = () => {
      list.style.display = "none"; box.value = "";
      const u = new URL(location);
      u.search = p.tm_id != null ? `?tm=${p.tm_id}`
               : `?name=${encodeURIComponent(p.player_name)}`;
      history.pushState({}, "", u);
      load();
    };
    list.appendChild(b);
  }
  list.style.display = "block";
}

/* ---------- page state ----------
   URL is the single source of truth: ?tm= | ?name= identify the player,
   ?s= the season ("career" or a season label), ?tab= the open lens,
   ?vs= the radar's comparison players.                                   */
const TABS = ["technical", "value", "ask"];
let rows = [], seasons = [], peers = [];
let hasTechnical = false, defaultTab = "value";

const qs = () => new URLSearchParams(location.search);
const mainTm = () => qs().get("tm");
const sel = () => {                       // selected season, or "career"
  const s = qs().get("s");
  return seasons.includes(s) ? s : "career";   // career is the default view
};
const tabSel = () => {
  const t = qs().get("tab");
  return TABS.includes(t) ? t : defaultTab;   // explicit ?tab= always wins
};
const vsList = () => (qs().get("vs") || "").split(",").filter(Boolean).slice(0, 3);

// the season every value-scoped block uses. "career" has no peer pool
// (percentiles are per season+league+position), so it pins to the latest
// season with enough minutes and the caption says so.
function pinnedSeason(){
  return [...rows].reverse().find(r => (r.minutes||0) >= MIN_MINUTES)?.season
       ?? seasons[seasons.length-1];
}

function pushUrl({s, tab, vs} = {}){
  const p = new URLSearchParams();
  const u0 = qs();
  if(u0.has("tm")) p.set("tm", u0.get("tm"));
  else if(u0.has("name")) p.set("name", u0.get("name"));
  const season = s !== undefined ? s : (u0.get("s") ?? "");
  if(season && season !== "career") p.set("s", season);   // career is the default, keep it out of the URL
  const t = tab !== undefined ? tab : tabSel();
  if(t) p.set("tab", t);
  const v = vs !== undefined ? vs : vsList();
  if(v.length) p.set("vs", v.join(","));
  const u = new URL(location);
  u.search = "?" + p.toString();
  history.pushState({}, "", u);
}

/* ---------- load ---------- */
window.addEventListener("popstate", load);
load();

async function load(){
  const u = qs();
  const main = document.getElementById("main");
  if(!u.has("tm") && !u.has("name")) return;
  main.innerHTML = `<div class="empty">Loading…</div>`;

  const params = {select: "*", order: "season"};
  if(u.has("tm")) params.tm_id = `eq.${u.get("tm")}`;
  else params.player_name = `eq.${u.get("name")}`;

  try{
    rows = await hub("player_season", params);
  }catch(e){
    main.innerHTML =
      `<div class="empty">Could not reach the database (${esc(e.message)}). Try again.</div>`;
    return;
  }
  if(!rows.length){
    main.innerHTML = `<div class="empty">No seasons found for this player.</div>`;
    return;
  }
  // safe here and not at the top of load(): these live in the technical module
  // further down the file, so they only exist once the script has evaluated.
  resetTechnicalCaches();

  seasons = [...new Set(rows.map(r => r.season))].sort();
  // Technical needs BOTH an Understat-era season and a matched Understat id.
  // Missing either, the page opens on Value — Technical stays reachable and
  // renders its coverage note instead of the old whole-page abort.
  hasTechnical = rows.some(r => +r.season >= XG_SINCE)
              && rows.some(r => r.understat_id != null);
  defaultTab = hasTechnical ? "technical" : "value";

  render();
}

/* ---------- value-tab logic, awaiting stage 3 ----------
   loadPeers/cardModel/pctsOf/METRIC are ported from player.html and have no
   caller until the Value tab renders — kept, not cut, because stage 3 wires
   them up as-is. The peer pool is deliberately NOT fetched on page load: the
   hero strip is career-only and needs none of it.                          */
async function loadPeers(){
  peers = [];
  const srow = seasonRow();
  if(!srow?.primary_position) return;
  // losing the pool must not cost the page its render — the strip degrades
  // to "no market data" on its own
  try{
    peers = await hub("player_season", {
      select: "player_name,team,minutes,starts,matches_played,nineties," +
              "non_penalty_goals_assists_per90,market_value_in_eur," +
              "tackles_interceptions_per90,save_pct,clean_sheet_pct,goals_against," +
              "np_xg,xa",
      league: `eq.${srow.league}`, season: `eq.${srow.season}`,
      primary_position: `eq.${srow.primary_position}`, minutes: `gte.${MIN_MINUTES}`});
  }catch(e){ /* peers stays [] */ }
}

// a mid-season mover has two rows; the value blocks rate the bigger stint
function seasonRow(){
  const s = sel() === "career" ? pinnedSeason() : sel();
  return rows.filter(r => r.season === s)
             .sort((a,b) => (b.minutes||0) - (a.minutes||0))[0];
}

/* ---------- career totals ----------
   The hero strip NEVER follows the season chips — it is the whole career,
   every season the hub has, Understat-era or not. Rates divide by the
   nineties of the rows that actually carry the stat, so a pre-2014 season
   with no xG doesn't drag an xG rate down.                                */
function careerModel(){
  const sum = k => rows.reduce((a,r) => a + (r[k] ?? 0), 0);
  const has = k => rows.some(r => r[k] != null);
  const n90Of = k => rows.reduce((a,r) => a + (r[k] != null ? (r.nineties ?? 0) : 0), 0);
  const last = rows[rows.length-1];

  const n90 = n90Of("non_penalty_goals");
  const npGA90 = n90 ? (sum("non_penalty_goals") + sum("assists")) / n90 : null;
  const overP = has("np_xg") ? sum("non_penalty_goals") - sum("np_xg") : null;

  return {
    last,
    span: seasons.length > 1 ? `${seasons[0]}–${seasons[seasons.length-1]}` : seasons[0],
    minutes: sum("minutes"),
    goals: sum("goals"), assists: sum("assists"),
    saves: has("saves") ? sum("saves") : null,
    cleanSheets: has("clean_sheets") ? sum("clean_sheets") : null,
    peakVal: rows.reduce((a,r) => Math.max(a, r.market_value_in_eur||0), 0) || null,
    npGA90, overP,
    seasons: seasons.length,
    clubs: new Set(rows.map(r => r.team)).size,
    // the shot-derived half of the game line needs shots_understat; these come
    // straight off player_season so the line can paint before shots land
    shots: has("shots") ? sum("shots") : null,
    npxg: has("np_xg") ? sum("np_xg") : null,
    tackles: has("tackles_won") ? sum("tackles_won") : null,
    intc: has("interceptions") ? sum("interceptions") : null,
  };
}

/* ---------- percentiles ---------- */
// pct(v) = share of pool strictly below v; pool = peers with the stat present
function pctsOf(pool, key){
  const vals = pool.map(p=>p[key]).filter(v=>v!=null).sort((a,b)=>a-b);
  const n = vals.length;
  return v => {
    if(v==null || n < 8) return null;   // tiny pools rank nothing meaningfully
    // midrank ties: a whole pool tied at 100% start share must read 50, not 0
    let lo=0, hi=n;
    while(lo<hi){ const m=(lo+hi)>>1; if(vals[m]<v) lo=m+1; else hi=m; }
    let up=lo, hi2=n;
    while(up<hi2){ const m=(up+hi2)>>1; if(vals[m]<=v) up=m+1; else hi2=m; }
    const mid = lo + Math.max(up-lo-1, 0)/2;
    return Math.round(100*mid/Math.max(n-1,1));
  };
}
const startShare = r => r.matches_played ? (r.starts||0)/r.matches_played : null;
const conceded90 = r => r.nineties && r.goals_against!=null ? r.goals_against/r.nineties : null;
// expected output per 90 — the process behind npG+A/90 (Understat, 2014+)
const npxga90 = r => r.nineties && r.np_xg!=null
  ? (r.np_xg + (r.xa ?? 0)) / r.nineties : null;

// position-appropriate output metric drives the rating, verdict and scatter
const METRIC = {
  FW: {key:"non_penalty_goals_assists_per90", label:"npG+A /90",
       fmt:v=>v?.toFixed(2)},
  MF: {key:"non_penalty_goals_assists_per90", label:"npG+A /90",
       fmt:v=>v?.toFixed(2)},
  DF: {key:"tackles_interceptions_per90", label:"Tkl+Int /90",
       fmt:v=>v?.toFixed(2), since:2017,
       note:"Tkl+Int/90 measures defensive volume, not quality — a dominant team's defender simply defends less."},
  GK: {key:"save_pct", label:"Save %",
       fmt:v=>v!=null ? v.toFixed(1)+"%" : null, since:2017,
       note:"Save% ignores shot difficulty — PSxG arrives with a later phase."},
};

function cardModel(srow, pool0){
  const metric = METRIC[srow.primary_position] ?? METRIC.FW;
  const pool = pool0.map(p=>({...p, start_share: startShare(p),
    conceded90: conceded90(p), npxga90: npxga90(p)}));
  const me = {...srow, start_share: startShare(srow), conceded90: conceded90(srow),
    npxga90: npxga90(srow)};
  const pct = {};
  for(const k of [metric.key, "minutes", "start_share", "market_value_in_eur",
                  "clean_sheet_pct", "npxga90"])
    pct[k] = pctsOf(pool, k)(me[k]);
  // fewer goals conceded = better: invert so a full bar means good
  const c = pctsOf(pool, "conceded90")(me.conceded90);
  pct.conceded = c==null ? null : 100 - c;
  const out = pct[metric.key], val = pct.market_value_in_eur;
  let verdict;
  if((srow.minutes||0) < MIN_MINUTES) verdict = {chip:"TOO FEW MINUTES", color:"var(--muted)",
    note:`Under ${MIN_MINUTES} minutes this season — rates aren't trustworthy, no verdict.`};
  else if(out==null && metric.since && +srow.season < metric.since)
    verdict = {chip:"NO VERDICT", color:"var(--muted)",
      note:`${metric.label} data starts in ${metric.since} — earlier seasons can't be rated for this position.`};
  else if(out==null || val==null) verdict = {chip:"NO MARKET DATA", color:"var(--muted)",
    note:"Missing a market value or a big enough peer pool — can't compare price to output."};
  else{
    const gap = out - val;
    verdict = gap > VERDICT_GAP  ? {chip:"BARGAIN", color:"var(--green)", gap} :
              gap < -VERDICT_GAP ? {chip:"PREMIUM", color:"var(--amber)", gap} :
                                   {chip:"FAIR VALUE", color:"var(--chalk-y)", gap};
  }
  if(metric.note) verdict.ceiling = metric.note;
  // finishing = outcome minus process. One season of it is mostly variance
  // (it stabilises over careers, not months) — labelled, never ranked.
  const overP = srow.non_penalty_goals!=null && srow.np_xg!=null
    ? srow.non_penalty_goals - srow.np_xg : null;
  return {pct, verdict, pool, me, metric, overP};
}

/* ---------- per-90 rates (technical scope) ----------
   Each rate divides by the minutes of the rows that actually carry the stat:
   a season with no Understat match has null xG but real minutes, and counting
   those minutes would silently understate every xG rate for that career.   */
function rates(rs){
  const n90All = rs.reduce((a,r)=>a+(r.nineties ?? 0), 0);
  if(!n90All) return null;
  const per90 = k => {
    let num = 0, den = 0;
    for(const r of rs) if(r[k]!=null){ num += r[k]; den += r.nineties ?? 0; }
    return den ? num/den : null;
  };
  const sum = k => rs.reduce((a,r)=>a+(r[k] ?? 0), 0);
  const shots = sum("shots"), npxg = sum("np_xg");
  const cards = rs.some(r=>r.yellow_cards!=null)
    ? per90("yellow_cards")+(per90("red_cards") ?? 0) : null;
  return {
    n90: n90All,
    npxg90:  per90("np_xg"),
    sh90:    per90("shots"),
    xgsh:    shots ? npxg/shots : null,
    npg90:   per90("non_penalty_goals"),
    xa90:    per90("xa"),
    kp90:    per90("key_passes"),
    chain90: per90("xg_chain"),
    build90: per90("xg_buildup"),
    tkl90:   per90("tackles_won"),
    int90:   per90("interceptions"),
    foul90:  per90("fouls_committed"),
    card90:  cards,
  };
}

// best season by npG+A/90 among seasons with >=10 nineties, else by G+A total
function bestSeason(){
  const bySeason = new Map();
  for(const r of rows){
    if(+r.season < XG_SINCE) continue;      // the chip is a technical-scope shortcut
    if(!bySeason.has(r.season)) bySeason.set(r.season, []);
    bySeason.get(r.season).push(r);
  }
  let best=null, bestScore=-1;
  for(const [ss, rs] of bySeason){
    const q = rates(rs);
    const score = (q && q.n90>=10 && q.npg90!=null)
      ? q.npg90 + (q.xa90 ?? 0)             // output rate when the sample holds
      : -1 + rs.reduce((a,r)=>a+(r.goals||0)+(r.assists||0),0)/1000;  // else raw tally
    if(score > bestScore){ bestScore=score; best=ss; }
  }
  return best;
}

// One justified line in the hero strip, replacing the old Game profile box.
// The player_season half paints immediately; the shot-derived half fills in
// once shots_understat lands. Career scope always — the strip ignores chips.
function gameLine(c, allShots){
  const item = (label, val) => `<span><i>${label}</i>${val}</span>`;
  const out = [
    item("Shots", c.shots ?? "—"),
    item("Goals", c.goals),
    item("npxG", c.npxg!=null ? c.npxg.toFixed(1) : "—"),
    item("Tackles won", c.tackles ?? "—"),
    item("Interceptions", c.intc ?? "—"),
  ];
  if(allShots?.length){
    const np = allShots.filter(r => r.situation != null);   // non-penalty
    const onT = allShots.filter(r => ["Goal","Saved Shot"].includes(r.result)).length;
    const dCount = {};
    let modeD = null, modeN = -1;
    for(const r of np){ const d = Math.round(DIST(r)); dCount[d] = (dCount[d]||0)+1;
      if(dCount[d] > modeN){ modeN = dCount[d]; modeD = d; } }
    const pct = n => np.length ? Math.round(100*n/np.length)+"%" : "—";
    const foot = k => np.filter(r => r.body_part === k).length;
    out.push(
      item("Mode dist", modeD!=null ? modeD+"m" : "—"),
      item("Left", pct(foot("Left Foot"))),
      item("Right", pct(foot("Right Foot"))),
      item("Head", pct(foot("Head"))),
      item("On target", allShots.length ? Math.round(100*onT/allShots.length)+"%" : "—"),
      item("In box", pct(np.filter(IN_BOX).length)),
    );
  }
  return out.join("");
}

   Technical tab — shots, game profile and the peer-ranked radar.

   lazily, the first time the tab is opened.
   ==================================================================== */

const techRows  = () => rows.filter(r => +r.season >= XG_SINCE);
const techSrow  = () => techRows()[techRows().length-1] ?? rows[rows.length-1];

let shots = [], shotsPromise = null;
const peerCache = new Map(), careerCache = new Map();

function resetTechnicalCaches(){
  shots = []; shotsPromise = null;
  selectedBands.clear();
  peerCache.clear(); careerCache.clear();

// one fetch per player: every shot, then filtered per season in the view
function loadShots(){
  if(shotsPromise) return shotsPromise;
  const uid = [...rows].reverse().find(r => r.understat_id != null)?.understat_id;
  if(uid == null) return shotsPromise = Promise.resolve(shots = []);
  shotsPromise = hubAll("shots_understat",
    {select:"season,date,team,xg,location_x,location_y,body_part,situation,result,minute",
     player_id:`eq.${uid}`, order:"date"})
    .then(r => shots = r)
    .catch(() => shots = []);      // map degrades to a stated gap
  return shotsPromise;
}

/* ---------- radar metric definitions ----------
   Each axis: want -> proxy -> grade. Rates are per 90, computed from summed
   totals so a career view is minutes-weighted rather than an average of
   averages. `inv:true` means lower raw value is better, so the percentile is
   flipped and a full axis always reads "good".                              */
const GROUPS = [
  {name:"Attack", color:"var(--amber)", grade:"direct",
   note:"Understat's xG model; shot volume is team-dependent.",
   axes:[
     {k:"npxg90",  lab:"npxG /90",   fmt:v=>v.toFixed(2)},
     {k:"sh90",    lab:"Shots /90",  fmt:v=>v.toFixed(2)},
     {k:"xgsh",    lab:"xG /shot",   fmt:v=>v.toFixed(3)},
     {k:"npg90",   lab:"npGoals /90",fmt:v=>v.toFixed(2)},
   ]},
  {name:"Playmaking", color:"var(--blue)", grade:"direct",
   note:"xGBuildup credits every player in a possession equally — it measures involvement, not the quality of the contribution.",
   axes:[
     {k:"xa90",    lab:"xA /90",       fmt:v=>v.toFixed(2)},
     {k:"kp90",    lab:"Key passes /90",fmt:v=>v.toFixed(2)},
     {k:"chain90", lab:"xGChain /90",  fmt:v=>v.toFixed(2)},
     {k:"build90", lab:"xGBuildup /90",fmt:v=>v.toFixed(2)},
   ]},
  {name:"Defense & discipline", color:"var(--green)", grade:"far",
   note:"Volume, not quality: a dominant team's defender simply defends less, and the best defending — being positioned so nothing happens — leaves no event to count.",
   axes:[
     {k:"tkl90",   lab:"Tackles won /90", fmt:v=>v.toFixed(2)},
     {k:"int90",   lab:"Interceptions /90",fmt:v=>v.toFixed(2)},
     {k:"foul90",  lab:"Fouls /90",       fmt:v=>v.toFixed(2), inv:true},
     {k:"card90",  lab:"Cards /90",       fmt:v=>v.toFixed(2), inv:true},
   ]},
];

// midrank percentile: a pool tied on a value reads 50, not 0
function pctOf(vals, v){
  if(v==null || vals.length < 8) return null;
  const s = [...vals].sort((a,b)=>a-b);
  let lo=0, hi=s.length;
  while(lo<hi){ const m=(lo+hi)>>1; if(s[m]<v) lo=m+1; else hi=m; }
  let up=lo, hi2=s.length;
  while(up<hi2){ const m=(up+hi2)>>1; if(s[m]<=v) up=m+1; else hi2=m; }
  const mid = lo + Math.max(up-lo-1,0)/2;
  return Math.round(100*mid/Math.max(s.length-1,1));
}

async function peerPool(league, pos, season){
  const key = `${league}|${pos}|${season}`;
  if(!peerCache.has(key)){
    const params = {select:"player_name,tm_id,nineties,np_xg,non_penalty_goals,shots,xa," +
      "key_passes,xg_chain,xg_buildup,tackles_won,interceptions,fouls_committed," +
      "yellow_cards,red_cards", league:`eq.${league}`, primary_position:`eq.${pos}`};
    params.season = season === "career" ? `gte.${XG_SINCE}` : `eq.${season}`;
    peerCache.set(key, hubAll("player_season", params).then(rs => {
      // career mode ranks whole careers, so peers are aggregated the same way.
      // Key on tm_id — two players can share a name, and merging them would
      // invent a peer with nobody's real rates.
      const byPlayer = new Map();
      for(const r of rs){
        const k = r.tm_id ?? `name:${r.player_name}`;
        if(!byPlayer.has(k)) byPlayer.set(k, []);
        byPlayer.get(k).push(r);
      }
      const out = [];
      for(const rs2 of byPlayer.values()){
        const q = rates(rs2);
        if(q && q.n90 >= MIN_90S_PEER) out.push(q);
      }
      return out;
    }));
  }
  return peerCache.get(key);
}

  return careerCache.get(tm);
}

/* ---------- game profile ---------- */
const DIST = r => Math.hypot((1-r.location_x)*105, (r.location_y-.5)*68);
const IN_BOX = r => r.location_x >= 1-16.5/105
  && r.location_y >= .5-20.16/68 && r.location_y <= .5+20.16/68;

/* ---------- xG band filter ---------- */
const BANDS = [
  {id:"a", lab:"≥ 0.80",     test:x=>x>=0.80},
  {id:"b", lab:"0.50–0.79",  test:x=>x>=0.50 && x<0.80},
  {id:"c", lab:"0.20–0.49",  test:x=>x>=0.20 && x<0.50},
  {id:"d", lab:"< 0.20",     test:x=>x<0.20},
];
const selectedBands = new Set();   // empty = show all

function drawBands(shotRows){
  const el = document.getElementById("bandchips");
  const n = shotRows.length;
  el.innerHTML = BANDS.map(b => {
    const c = shotRows.filter(r => b.test(r.xg)).length;
    const on = selectedBands.has(b.id);
    return `<button class="band" data-band="${b.id}" aria-pressed="${on}">
      <span class="lab">xG ${b.lab}</span>
      <span class="pc">${n?Math.round(100*c/n):0}% <span style="font-size:11px;color:var(--muted)">· ${c}</span></span>
    </button>`;
  }).join("");
  const shown = selectedBands.size
    ? shotRows.filter(r => BANDS.some(b => selectedBands.has(b.id) && b.test(r.xg)))
    : shotRows;
  drawPitch(shown, selectedBands.size > 0);
}

/* ---------- shot map ---------- */
// Understat coords are normalised: location_x 1.0 = opponent goal line,
// location_y 0.5 = centre. Drawn as a vertical attacking third, goal at top.
const PITCH = {W:520, H:440, X0:0.55};   // show from 55% of pitch length up
// Understat y<0.5 is the attacking team's RIGHT (a right-winger's shots sit
// there); flip so the map reads from the attacker's view — their right on the
// viewer's right. Everything else drawn is symmetric about y=0.5.
const ppx = ly => 30 + (PITCH.W-60) * (1 - ly);
// ~0.4% of shots come from deeper than the drawn area (halfway-line efforts);
// pin them to the bottom edge so they stay countable instead of rendering
// off-canvas, and mark them so the position isn't read as literal
const ppy = lx => PITCH.H - 26 -
  (PITCH.H-56) * Math.max(0, (lx - PITCH.X0)/(1 - PITCH.X0));
const offMap = lx => lx < PITCH.X0;

function drawPitch(sr, filtered){
  const el = document.getElementById("pitch");
  const L = (x1,y1,x2,y2) => `<line x1="${ppx(y1).toFixed(1)}" y1="${ppy(x1).toFixed(1)}"
    x2="${ppx(y2).toFixed(1)}" y2="${ppy(x2).toFixed(1)}" stroke="var(--axis)"
    stroke-opacity=".45" stroke-width="1.5"/>`;
  // metric marks converted to Understat's normalised space (105m x 68m)
  const boxX = 1-16.5/105, sixX = 1-5.5/105, spotX = 1-11/105;
  const boxY0 = .5-20.16/68, boxY1 = .5+20.16/68;
  const sixY0 = .5-9.16/68,  sixY1 = .5+9.16/68;
  const goalY0 = .5-3.66/68, goalY1 = .5+3.66/68;
  const lines = `
    ${L(1,0,1,1)}${L(PITCH.X0,0,PITCH.X0,1)}${L(PITCH.X0,0,1,0)}${L(PITCH.X0,1,1,1)}
    ${L(boxX,boxY0,boxX,boxY1)}${L(boxX,boxY0,1,boxY0)}${L(boxX,boxY1,1,boxY1)}
    ${L(sixX,sixY0,sixX,sixY1)}${L(sixX,sixY0,1,sixY0)}${L(sixX,sixY1,1,sixY1)}
    <line x1="${ppx(goalY0)}" y1="${ppy(1)-3}" x2="${ppx(goalY1)}" y2="${ppy(1)-3}"
      stroke="var(--line)" stroke-opacity=".8" stroke-width="3"/>
    <circle cx="${ppx(.5)}" cy="${ppy(spotX)}" r="2" fill="var(--axis)"/>`;

  if(!sr.length){
    el.innerHTML = `<svg viewBox="0 0 ${PITCH.W} ${PITCH.H}">${lines}
      <text x="${PITCH.W/2}" y="${PITCH.H/2}" text-anchor="middle" font-size="13"
        fill="var(--muted)">${filtered ? "no shots in the selected xG band(s)" : "no shots on record"}</text></svg>`;
    document.getElementById("pitchcap").textContent = filtered
      ? "No shots fall in the chosen xG band — clear a band to see the rest."
      : "Understat records no shots here — keepers and unmatched players show empty.";
    return;
  }
  // goals drawn last so they sit above the misses
  const ordered = [...sr].sort((a,b) => (a.result==="Goal") - (b.result==="Goal"));
  const dots = ordered.map(r => {
    const goal = r.result === "Goal";
    // area ~ xG, so a 0.4 chance looks twice a 0.1 rather than sixteen times
    const rad = 3 + Math.sqrt(Math.max(r.xg,0)) * 13;
    const off = offMap(r.location_x);
    return `<circle data-i="${sr.indexOf(r)}" cx="${ppx(r.location_y).toFixed(1)}"
      cy="${ppy(r.location_x).toFixed(1)}" r="${rad.toFixed(1)}"
      fill="${goal ? "var(--amber)" : "rgba(242,245,239,.30)"}"
      stroke="${goal ? "#20160a" : "rgba(242,245,239,.45)"}" stroke-width="${goal?1.5:1}"
      ${off ? 'stroke-dasharray="2 2"' : ""}
      ${goal?'':'fill-opacity=".75"'}/>`;
  }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${PITCH.W} ${PITCH.H}" id="pitchsvg"
     aria-label="Shot map: every shot with goals highlighted">${lines}${dots}</svg>`;

  const goals = sr.filter(r => r.result === "Goal").length;
  const xgSum = sr.reduce((a,r) => a+r.xg, 0);
  const off = sr.filter(r => offMap(r.location_x)).length;
  document.getElementById("pitchcap").innerHTML =
    `${filtered?"<b>Filtered</b> · ":""}${sr.length} shots · ${goals} goals · ${xgSum.toFixed(1)} xG` +
    (sr.length < MIN_SHOTS_MAP
      ? ` — <span style="color:var(--chalk-y)">too few shots to read a pattern from
         placement</span>.`
      : `. Penalties sit on the spot.`) +
    (off ? ` ${off} shot${off>1?"s":""} from deeper than the drawn area
       ${off>1?"are":"is"} pinned to the bottom edge (dashed).` : "");

  const svg = document.getElementById("pitchsvg");
  svg.addEventListener("mousemove", e => {
    const c = e.target.closest("circle[data-i]");
    if(!c){ hideTip(); return; }
    const r = sr[+c.dataset.i];
    showTip(e, `<div class="t">${esc(r.date)} · ${esc(r.team)}</div>
      ${esc(r.result)} · ${r.xg.toFixed(3)} xG<br>
      ${esc(r.situation ?? "Penalty")} · ${esc(r.body_part ?? "?")} · ${r.minute}'`);
  });
  svg.addEventListener("mouseleave", hideTip);
}

/* ---------- radar (solo group-coloured, or multi-player overlay) ---------- */
// build one player's slice list (percentile vs the SHARED pool, so axes mean
// the same thing for everyone on the chart)
function slicesFor(rowsForPlayer, pool){
  const q = rates(rowsForPlayer);
  if(!q) return null;
  const out = [];
  for(const g of GROUPS) for(const a of g.axes){
    const raw = q[a.k];
    const p = raw==null ? null : pctOf(pool.map(x=>x[a.k]).filter(v=>v!=null), raw);
    out.push({...a, group:g.name, color:g.color, raw,
              pct: p==null ? null : (a.inv ? 100-p : p)});
  }
  return out;
}

async function drawRadars(season){
  const pz = document.getElementById("pizza");
  const ax = document.getElementById("axlists");
  const srow = techSrow();
  const vs = vsList();
  const compare = vs.length > 0;
  // comparisons need a common basis → force career when overlaying
  const rSeason = compare ? "career" : season;

  let pool;
  try{ pool = await peerPool(srow.league, srow.primary_position, rSeason); }
  catch(e){ pz.innerHTML = `<p class="cap">Could not load the peer pool
    (${esc(e.message)}).</p>`; return; }

  // main player
  const mainRows = rSeason === "career" ? techRows() : techRows().filter(r => r.season === rSeason);
  const players = [{tm:mainTm(), name:srow.player_name, pos:srow.primary_position,
                    color:SERIES[0], slices:slicesFor(mainRows, pool)}];
  // comparison players (career), ranked against the SAME pool
  for(let i=0;i<vs.length;i++){
    let rs = []; try{ rs = await playerCareer(vs[i]); }catch{}
    if(!rs.length) continue;
    const sr = rs[rs.length-1];
    players.push({tm:vs[i], name:sr.player_name, pos:sr.primary_position,
      color:SERIES[i+1], slices:slicesFor(rs, pool)});
  }
  const valid = players.filter(p => p.slices);
  if(!valid.length){ pz.innerHTML = `<p class="cap">No minutes in this selection.</p>`;
    ax.innerHTML = ""; return; }

  pz.innerHTML = profileRadar(valid, compare);

  // legend + compare chips
  document.getElementById("pzlegend").innerHTML = compare
    ? valid.map(p => `<span class="i"><span class="swatch" style="background:${p.color}"></span>
        ${esc(p.name)}</span>`).join("")
    : `<span class="i"><span class="swatch" style="background:var(--amber)"></span>Attack</span>
       <span class="i"><span class="swatch" style="background:var(--blue)"></span>Playmaking</span>
       <span class="i"><span class="swatch" style="background:var(--green)"></span>Defence</span>`;
  document.getElementById("cmpchips").innerHTML = valid.slice(1).map(p =>
    `<span class="cmpchip" style="border-color:${p.color}">
       <span class="swatch" style="background:${p.color}"></span>${esc(p.name)}
       <button data-rmvs="${p.tm}" aria-label="remove">×</button></span>`).join("");

  // axis list: solo = grouped w/ percentiles; compare = per-player columns
  ax.innerHTML = compare
    ? `<div class="axlist cmp nums" style="--np:${valid.length}"><div class="r head"><span></span>
         ${valid.map(p => `<b style="color:${p.color}">${esc(p.name.split(" ").pop())}</b>`).join("")}</div>
       ${GROUPS.flatMap(g => g.axes).map((a,i) => `<div class="r"><span>${esc(a.lab)}${a.inv?" ↓":""}</span>
         ${valid.map(p => `<b>${p.slices[i].pct ?? "—"}</b>`).join("")}</div>`).join("")}</div>`
    : GROUPS.map(g => {
        const rs = valid[0].slices.filter(s => s.group === g.name);
        return `<div class="axgroup">
          <h3 style="color:${g.color}"><span class="swatch" style="background:${g.color}"></span>
            ${esc(g.name)}</h3>
          <div class="axlist nums">
            ${rs.map(a => `<div class="r"><span>${esc(a.lab)}${a.inv?" ↓":""}</span>
              <span class="raw">${a.raw==null?"—":a.fmt(a.raw)}</span>
              <b style="color:${a.pct==null?"var(--muted)":g.color}">${a.pct ?? "—"}</b></div>`).join("")}
          </div></div>`;
      }).join("");

}

const HEX = {"var(--amber)":"#ffb43a", "var(--blue)":"#5aa9f0", "var(--green)":"#8fd18a",
             "var(--chalk-y)":"#e8d47a", "var(--red)":"#e0524a"};

// Radar. Solo: one group-coloured polygon over a grey peer-median backdrop.
// Compare: each player a single-colour line polygon, no median (the overlay is
// the reference). `players` = [{name,color,slices}], slices share the same axes.
function profileRadar(players, compare){
  window._players = players;
  const S=480, cx=S/2, cy=S/2, R0=32, R1=146, N=players[0].slices.length;
  const step = 2*Math.PI/N, gap = 0.03;
  const ang = i => -Math.PI/2 + (i+0.5)*step;         // vertex sits mid-wedge
  const rad = p => R0 + (R1-R0)*(p ?? 0)/100;
  const at  = (i,p) => [cx + rad(p)*Math.cos(ang(i)), cy + rad(p)*Math.sin(ang(i))];
  const ptAbs = (r,a) => `${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`;
  const hex = c => HEX[c] ?? c;
  const slices = players[0].slices;   // axis definitions shared across players

  let g = "";
  for(const f of [.25,.5,.75,1])
    g += `<circle cx="${cx}" cy="${cy}" r="${(R0+(R1-R0)*f).toFixed(1)}" fill="none"
      stroke="var(--grid)" stroke-dasharray="${f===1?"none":"2 4"}"/>`;

  // peer-median backdrop only in solo mode (in compare, the overlay is the reference)
  if(!compare){
    slices.forEach((s,i) => {
      const a0 = -Math.PI/2 + i*step + gap, a1 = -Math.PI/2 + (i+1)*step - gap, r = rad(50);
      g += `<path d="M ${ptAbs(R0,a0)} L ${ptAbs(r,a0)} A ${r} ${r} 0 0 1 ${ptAbs(r,a1)}
        L ${ptAbs(R0,a1)} A ${R0} ${R0} 0 0 0 ${ptAbs(R0,a0)} Z"
        fill="var(--line)" fill-opacity=".08"/>`;
    });
    g += `<circle cx="${cx}" cy="${cy}" r="${rad(50).toFixed(1)}" fill="none"
      stroke="var(--line)" stroke-opacity=".22" stroke-dasharray="1 5"/>`;
  }
  slices.forEach((s,i) => { const [x,y] = at(i,100);
    g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
      stroke="var(--grid)"/>`; });

  const polyPts = sl => sl.map((s,i) => at(i,s.pct).map(v => v.toFixed(1)).join(",")).join(" ");

  if(!compare){
    // solo: group-coloured fans + group-coloured edges + group dots
    const sl = slices;
    g += `<polygon points="${polyPts(sl)}" fill="var(--line)" fill-opacity=".05"/>`;
    for(const gr of [...new Set(sl.map(s => s.group))]){
      const idx = sl.map((s,i) => ({s,i})).filter(o => o.s.group === gr).map(o => o.i);
      const pts = [`${cx},${cy}`, ...idx.map(i => at(i,sl[i].pct).map(v => v.toFixed(1)).join(","))].join(" ");
      g += `<polygon points="${pts}" fill="${hex(sl[idx[0]].color)}" fill-opacity=".20"/>`;
    }
    sl.forEach((s,i) => {
      const j=(i+1)%N, [x1,y1]=at(i,s.pct), [x2,y2]=at(j,sl[j].pct);
      const col = s.group===sl[j].group ? hex(s.color) : "rgba(242,245,239,.45)";
      g += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}"
        y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`;
    });
    sl.forEach((s,i) => { if(s.pct==null) return; const [x,y]=at(i,s.pct);
      g += `<circle data-p="0" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"
        fill="${hex(s.color)}" stroke="var(--card)" stroke-width="1.5" style="cursor:default"/>`; });
  }else{
    // compare: one single-colour line polygon (light fill) per player
    players.forEach((pl,pi) => {
      const c = hex(pl.color);
      g += `<polygon points="${polyPts(pl.slices)}" fill="${c}" fill-opacity=".08"
        stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;
      pl.slices.forEach((s,i) => { if(s.pct==null) return; const [x,y]=at(i,s.pct);
        g += `<circle data-p="${pi}" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"
          fill="${c}" stroke="var(--card)" stroke-width="1.5" style="cursor:default"/>`; });
    });
  }

  // labels (shared axes)
  slices.forEach((s,i) => {
    const a = ang(i), deg = a*180/Math.PI, flip = deg>90 || deg<-90;
    const lr = R1+26, lx = cx+lr*Math.cos(a), ly = cy+lr*Math.sin(a);
    g += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}"
      text-anchor="${flip?"end":"start"}" dominant-baseline="middle" font-size="10.5"
      transform="rotate(${(flip?deg+180:deg).toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})"
      fill="var(--line)" fill-opacity=".85">${esc(s.lab.replace(" /90",""))}${s.inv?" ↓":""}</text>`;
  });
  g += `<circle cx="${cx}" cy="${cy}" r="${(R0-6).toFixed(1)}" fill="var(--card)"
    stroke="var(--border)"/>`;
  return `<svg viewBox="0 0 ${S} ${S}" id="pizzasvg" aria-label="Player profile radar"
     onmousemove="pizzaHover(event)" onmouseleave="hidePizza()">${g}</svg>`;
}
// hover survives innerHTML swaps
window.pizzaHover = e => {
  const d = e.target.closest("circle[data-i]");
  if(!d){ hideTip(); return; }
  const pl = window._players?.[+d.dataset.p];
  const s = pl?.slices[+d.dataset.i];
  if(s) showTip(e, `<div class="t">${esc(pl.name)} · ${esc(s.group)}</div>
    ${esc(s.lab)}${s.inv?" ↓":""}: <b>${s.raw==null?"—":s.fmt(s.raw)}</b>
    · ${s.pct ?? "—"}th pct`);
};
window.hidePizza = () => hideTip();
</script>
