<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Dashboard — SoccerHub</title>
<meta name="description" content="Is the playtime and output on par with the market value? One card per player-season, ranked against positional peers.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
  :root{
    --grass:#122b1a; --grass-lt:#16321f; --card:#0a1a0e;
    --line:#f2f5ef; --muted:#9fb69c; --tag:#8fae8b; --border:rgba(242,245,239,.22);
    --amber:#ffb43a; --green:#8fd18a; --chalk-y:#e8d47a; --blue:#5aa9f0;
    --grid:rgba(242,245,239,.10); --axis:rgba(242,245,239,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:
       repeating-linear-gradient(0deg,var(--grass) 0 72px,var(--grass-lt) 72px 144px);
       color:var(--line);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
       min-height:100vh}
  .disp{font-family:"Avenir Next Condensed","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
        text-transform:uppercase;letter-spacing:.04em;font-stretch:condensed}
  .nums{font-variant-numeric:tabular-nums}
  a{color:var(--chalk-y)}

  .top{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;
       padding:12px 20px;background:rgba(5,14,8,.92);backdrop-filter:blur(4px);
       border-bottom:1px solid var(--border)}
  .top a.home{color:var(--line);text-decoration:none;font-size:1.05rem;white-space:nowrap}
  .searchwrap{position:relative;flex:1;max-width:440px}
  #search{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--border);
       background:var(--card);color:var(--line);font:inherit;font-size:.95rem}
  #search::placeholder{color:var(--tag)}
  #search:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  #results{position:absolute;top:110%;left:0;right:0;background:var(--card);
       border:1px solid var(--border);border-radius:6px;overflow:hidden;display:none;
       max-height:320px;overflow-y:auto}
  #results button{display:flex;justify-content:space-between;gap:12px;width:100%;
       padding:10px 14px;border:0;background:none;color:var(--line);font:inherit;
       font-size:.9rem;text-align:left;cursor:pointer}
  #results button:hover,#results button:focus-visible{background:rgba(255,180,58,.12);outline:none}
  #results .sub{color:var(--tag);font-size:.8rem;white-space:nowrap}

  main{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
  .empty{color:var(--muted);text-align:center;padding:80px 20px;max-width:46ch;margin:0 auto}
  .empty .disp{color:var(--line);font-size:1.6rem}

  /* season chips */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
  .chips button{border:1px solid var(--border);background:var(--card);color:var(--muted);
       border-radius:999px;padding:4px 12px;font:inherit;font-size:.8rem;cursor:pointer}
  .chips button[aria-pressed="true"]{background:var(--amber);color:#20160a;
       border-color:var(--amber);font-weight:700}
  .chips button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

  /* card + scatter grid */
  .duo{display:grid;grid-template-columns:390px 1fr;gap:22px;align-items:start}
  @media(max-width:900px){.duo{grid-template-columns:1fr}}
  .panel{display:grid;gap:16px}

  .pcard{border-radius:18px;padding:24px 24px 20px;
        background:linear-gradient(160deg,#2a4d2f 0%,#17331e 55%,#0e2413 100%);
        border:1px solid rgba(255,180,58,.55);
        box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08)}
  .pcard .head{display:flex;gap:16px;align-items:flex-start}
  .rating{text-align:center;min-width:74px}
  .rating b{display:block;font-size:56px;line-height:.9;color:var(--amber)}
  .rating span{font-size:10.5px;letter-spacing:.12em;color:var(--chalk-y)}
  .idbox h1{margin:0;font-size:34px;line-height:.95}
  .idbox p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
  .verdict{margin:16px 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chip{color:#0e2413;font-weight:800;padding:6px 14px;border-radius:999px;
        font-size:13px;letter-spacing:.08em}
  .verdict small{color:var(--muted)}
  .bar{display:grid;grid-template-columns:92px 1fr 96px;gap:10px;align-items:center;
       font-size:12px;margin:8px 0}
  .bar label{letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .bar .track{height:9px;border-radius:5px;background:rgba(242,245,239,.14);overflow:hidden}
  .bar .fill{height:100%;border-radius:5px}
  .bar b{text-align:right}
  .bar .raw{color:var(--muted);font-weight:400;margin-right:8px}
  .cardrow{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;
       font-size:12px;margin:10px 0}
  .cardrow label{letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .cardrow .dots{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
  .cardrow .yc,.cardrow .rc{width:9px;height:12px;border-radius:2px;display:inline-block}
  .cardrow .yc{background:#f5c542}
  .cardrow .rc{background:#e0524a}
  .cardrow .rate{color:var(--muted);margin-left:8px}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px;
         border-top:1px solid rgba(242,245,239,.15);padding-top:14px;text-align:center}
  .facts label{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .facts b{font-size:17px}
  .cardnote{margin:14px 0 0;font-size:11.5px;color:var(--muted)}
  .warn{color:var(--chalk-y);cursor:help}

  .box{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px}
  .box h2{margin:0 0 8px;font-size:.8rem;letter-spacing:.16em;
        text-transform:uppercase;color:var(--tag);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .box h2 .plain{color:var(--muted);letter-spacing:0;text-transform:none}
  .box p.cap{margin:8px 0 0;font-size:12px;color:var(--muted)}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
  .chartbox{position:relative}
  .chartbox svg{width:100%;height:auto;display:block}
  #tip{position:fixed;z-index:9;pointer-events:none;display:none;background:#050e08;
       border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-size:.8rem;
       color:var(--line);box-shadow:0 4px 16px rgba(0,0,0,.5)}
  #tip .t{color:var(--tag);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}

  section.chart{background:var(--card);border:1px solid var(--border);border-radius:4px;
        padding:16px 16px 10px;margin-top:22px}
  section.chart h2{margin:0 0 2px;font-size:.8rem;letter-spacing:.16em;
        text-transform:uppercase;color:var(--tag);display:flex;gap:8px;align-items:center}

  details.season-log{margin-top:22px;background:var(--card);border:1px solid var(--border);
       border-radius:4px}
  details.season-log summary{padding:14px 16px;font-size:.8rem;letter-spacing:.16em;
       text-transform:uppercase;color:var(--tag);cursor:pointer}
  details.season-log .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:640px}
  th,td{padding:8px 14px;text-align:right;border-top:1px solid rgba(242,245,239,.08)}
  th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tag);
     font-weight:600}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),
  th:nth-child(3),td:nth-child(3){text-align:left}
  tbody tr:hover{background:rgba(255,180,58,.06)}
  .dim{color:var(--muted)}
</style>
</head>
<body>
<nav class="top">
  <a class="home disp" href="index.html">⚽ SoccerHub</a>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Search any player, 2008–2025…"
           autocomplete="off" aria-label="Search player">
    <div id="results" role="listbox"></div>
  </div>
</nav>

<main id="main">
  <div class="empty" id="empty">
    <p class="disp">Pick a player</p>
    <p>Search 49,692 player-seasons across the Premier League, La Liga, Bundesliga,
       Serie A and Ligue 1 — 2008 to today.</p>
  </div>
</main>
<div id="tip" role="status"></div>

<script>
const SUPABASE_URL = "https://rgnzemkdldohplwbxxwy.supabase.co";
const ANON_KEY = "sb_publishable_Qy0bJ4CdrxffuJGNq12ebw_r0-Z3qD-";
const MIN_MINUTES = 450;          // pipeline nulls rates below this — same floor here
const VERDICT_GAP = 15;           // |output pct − value pct| beyond this = not "fair"

async function hub(table, params){
  const q = new URLSearchParams(params);
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${q}`,
                        {headers:{apikey: ANON_KEY}});
  if(!r.ok) throw new Error(`${table}: ${r.status}`);
  return r.json();
}

const eur = v => v==null ? "—" :
  v >= 1e6 ? `€${(v/1e6).toFixed(v>=10e6?0:1)}M` : `€${Math.round(v/1e3)}k`;
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- search ---------- */
const box = document.getElementById("search");
const list = document.getElementById("results");
let deb;
box.addEventListener("input", () => {
  clearTimeout(deb);
  const q = box.value.trim();
  if(q.length < 3){ list.style.display = "none"; return; }
  deb = setTimeout(() => runSearch(q), 300);
});
document.addEventListener("click", e => {
  if(!e.target.closest(".searchwrap")) list.style.display = "none";
});

async function runSearch(q){
  const rows = await hub("player_season", {
    select: "player_name,tm_id,team,season,league",
    player_name: `ilike.*${q}*`, order: "season.desc", limit: "60"});
  const seen = new Set(); const picks = [];
  for(const r of rows){
    const key = r.tm_id ?? `name:${r.player_name}`;
    if(seen.has(key)) continue;
    seen.add(key); picks.push(r);
    if(picks.length === 8) break;
  }
  list.innerHTML = picks.length ? "" : "<button disabled>No players found</button>";
  for(const p of picks){
    const b = document.createElement("button");
    b.setAttribute("role","option");
    b.innerHTML = `<span>${esc(p.player_name)}</span>
       <span class="sub">${esc(p.team)} · ${esc(p.season)}</span>`;
    b.onclick = () => {
      list.style.display = "none"; box.value = "";
      const u = new URL(location);
      u.search = p.tm_id != null ? `?tm=${p.tm_id}`
               : `?name=${encodeURIComponent(p.player_name)}`;
      history.pushState({}, "", u);
      load();
    };
    list.appendChild(b);
  }
  list.style.display = "block";
}

/* ---------- page load ---------- */
window.addEventListener("popstate", load);
load();

async function load(){
  const u = new URLSearchParams(location.search);
  const main = document.getElementById("main");
  if(!u.has("tm") && !u.has("name")) return;
  main.innerHTML = `<div class="empty">Loading…</div>`;
  const params = {select: "*", order: "season"};
  if(u.has("tm")) params.tm_id = `eq.${u.get("tm")}`;
  else params.player_name = `eq.${u.get("name")}`;
  let rows, moves = [];
  try{
    rows = await hub("player_season", params);
    if(u.has("tm"))
      moves = await hub("transfers",
        {select:"transfer_date,from_club_name,to_club_name,transfer_fee,market_value_in_eur",
         tm_id:`eq.${u.get("tm")}`, order:"transfer_date"});
  }
  catch(e){ main.innerHTML =
    `<div class="empty">Could not reach the database (${esc(e.message)}). Try again.</div>`;
    return; }
  if(!rows.length){ main.innerHTML =
    `<div class="empty">No seasons found for this player.</div>`; return; }

  // card season: ?s= override, else latest with enough minutes, else latest
  const seasons = [...new Set(rows.map(r=>r.season))].sort();
  let season = u.get("s");
  if(!seasons.includes(season)){
    season = [...rows].reverse().find(r=>(r.minutes||0) >= MIN_MINUTES)?.season
           ?? seasons[seasons.length-1];
  }
  // a mid-season mover has two rows; the card rates the bigger stint
  const srow = rows.filter(r=>r.season===season)
                   .sort((a,b)=>(b.minutes||0)-(a.minutes||0))[0];

  let peers = [], curve = [];
  if(srow.primary_position){
    // independent fetches: losing the curve must not cost the card its percentiles
    const [pr, cr] = await Promise.allSettled([
      hub("player_season", {
        select: "player_name,team,minutes,starts,matches_played,nineties," +
                "non_penalty_goals_assists_per90,market_value_in_eur," +
                "tackles_interceptions_per90,save_pct,clean_sheet_pct,goals_against," +
                "np_xg,xa",
        league: `eq.${srow.league}`, season: `eq.${season}`,
        primary_position: `eq.${srow.primary_position}`, minutes: `gte.${MIN_MINUTES}`}),
      hub("age_curve", {select: "age,avg_value_eur",
        primary_position: `eq.${srow.primary_position}`, order: "age"}),
    ]);
    if(pr.status === "fulfilled") peers = pr.value;
    if(cr.status === "fulfilled") curve = cr.value;
  }
  render(rows, moves, srow, peers, seasons, curve);
}

/* transfer date -> season start-year label ('2022-07-01' -> '2022') */
const moveSeason = d => {
  const [y,m] = d.split("-").map(Number);
  return String(m >= 7 ? y : y-1);
};

/* ---------- percentiles ---------- */
// pct(v) = share of pool strictly below v; pool = peers with the stat present
function pctsOf(pool, key){
  const vals = pool.map(p=>p[key]).filter(v=>v!=null).sort((a,b)=>a-b);
  const n = vals.length;
  return v => {
    if(v==null || n < 8) return null;   // tiny pools rank nothing meaningfully
    // midrank ties: a whole pool tied at 100% start share must read 50, not 0
    let lo=0, hi=n;
    while(lo<hi){ const m=(lo+hi)>>1; if(vals[m]<v) lo=m+1; else hi=m; }
    let up=lo, hi2=n;
    while(up<hi2){ const m=(up+hi2)>>1; if(vals[m]<=v) up=m+1; else hi2=m; }
    const mid = lo + Math.max(up-lo-1, 0)/2;
    return Math.round(100*mid/Math.max(n-1,1));
  };
}
const startShare = r => r.matches_played ? (r.starts||0)/r.matches_played : null;
const conceded90 = r => r.nineties && r.goals_against!=null ? r.goals_against/r.nineties : null;
// expected output per 90 — the process behind npG+A/90 (Understat, 2014+)
const npxga90 = r => r.nineties && r.np_xg!=null
  ? (r.np_xg + (r.xa ?? 0)) / r.nineties : null;
// league seasons: 34 games in the Bundesliga, 38 everywhere else in the big five
const availability = r => Math.min(1, (r.minutes||0) /
  ((r.league?.startsWith("GER") ? 34 : 38) * 90));

// position-appropriate output metric drives the rating, verdict and scatter
const METRIC = {
  FW: {key:"non_penalty_goals_assists_per90", label:"npG+A /90",
       fmt:v=>v?.toFixed(2)},
  MF: {key:"non_penalty_goals_assists_per90", label:"npG+A /90",
       fmt:v=>v?.toFixed(2)},
  DF: {key:"tackles_interceptions_per90", label:"Tkl+Int /90",
       fmt:v=>v?.toFixed(2), since:2017,
       note:"Tkl+Int/90 measures defensive volume, not quality — a dominant team's defender simply defends less."},
  GK: {key:"save_pct", label:"Save %",
       fmt:v=>v!=null ? v.toFixed(1)+"%" : null, since:2017,
       note:"Save% ignores shot difficulty — PSxG arrives with a later phase."},
};

function cardModel(srow, peers){
  const metric = METRIC[srow.primary_position] ?? METRIC.FW;
  const pool = peers.map(p=>({...p, start_share: startShare(p),
    conceded90: conceded90(p), npxga90: npxga90(p)}));
  const me = {...srow, start_share: startShare(srow), conceded90: conceded90(srow),
    npxga90: npxga90(srow)};
  const pct = {};
  for(const k of [metric.key, "minutes", "start_share", "market_value_in_eur",
                  "clean_sheet_pct", "npxga90"])
    pct[k] = pctsOf(pool, k)(me[k]);
  // fewer goals conceded = better: invert so a full bar means good
  const c = pctsOf(pool, "conceded90")(me.conceded90);
  pct.conceded = c==null ? null : 100 - c;
  const out = pct[metric.key], val = pct.market_value_in_eur;
  let verdict;
  if((srow.minutes||0) < MIN_MINUTES) verdict = {chip:"TOO FEW MINUTES", color:"var(--muted)",
    note:`Under ${MIN_MINUTES} minutes this season — rates aren't trustworthy, no verdict.`};
  else if(out==null && metric.since && +srow.season < metric.since)
    verdict = {chip:"NO VERDICT", color:"var(--muted)",
      note:`${metric.label} data starts in ${metric.since} — earlier seasons can't be rated for this position.`};
  else if(out==null || val==null) verdict = {chip:"NO MARKET DATA", color:"var(--muted)",
    note:"Missing a market value or a big enough peer pool — can't compare price to output."};
  else{
    const gap = out - val;
    verdict = gap > VERDICT_GAP  ? {chip:"BARGAIN", color:"var(--green)", gap} :
              gap < -VERDICT_GAP ? {chip:"PREMIUM", color:"var(--amber)", gap} :
                                   {chip:"FAIR VALUE", color:"var(--chalk-y)", gap};
  }
  if(metric.note) verdict.ceiling = metric.note;
  // finishing = outcome minus process. One season of it is mostly variance
  // (it stabilises over careers, not months) — labelled, never ranked.
  const overP = srow.non_penalty_goals!=null && srow.np_xg!=null
    ? srow.non_penalty_goals - srow.np_xg : null;
  return {pct, verdict, pool, me, metric, overP};
}

/* ---------- render ---------- */
function render(rows, moves, srow, peers, seasons, curve = []){
  const typical = Object.fromEntries(curve.map(c=>[c.age, c.avg_value_eur]));
  const last = rows[rows.length-1];
  const sum = k => rows.reduce((a,r)=>a+(r[k]||0),0);
  const peakVal = rows.reduce((a,r)=>Math.max(a,r.market_value_in_eur||0),0);
  const clubs = new Set(rows.map(r=>r.team)).size;
  document.title = `${last.player_name} — SoccerHub`;
  const m = cardModel(srow, peers);

  const chips = seasons.map(s=>
    `<button data-s="${esc(s)}" aria-pressed="${s===srow.season}">${esc(s)}</button>`).join("");

  const bar = (label,p,color,raw) => `
    <div class="bar"><label>${label}</label>
      <div class="track"><div class="fill" style="width:${p??0}%;background:${color}"></div></div>
      <b class="nums"><span class="raw">${raw ?? ""}</span>${p??"—"}</b></div>`;

  // literal booking cards: one dot per card, actual card colors (icon array —
  // counts this small read better as objects than as a percentile)
  const cardDots = r => {
    const y = r.yellow_cards ?? 0, red = r.red_cards ?? 0, mins = r.minutes || 0;
    const dot = (cls,n) => Array(Math.min(n,15)).fill(`<span class="${cls}"></span>`).join("")
      + (n>15 ? `<span class="rate">×${n}</span>` : "");
    const rate = (y+red) > 0 && mins
      ? `1 card / ${Math.round(mins/(y+red)).toLocaleString("en")} min`
      : "clean season";
    return `<div class="cardrow"><label>Cards</label>
      <div class="dots" role="img" aria-label="${y} yellow, ${red} red cards">
        ${dot("yc",y)}${dot("rc",red)}
        <span class="rate nums">${y}Y${red ? " "+red+"R" : ""} · ${rate}</span>
      </div></div>`;
  };

  const pens = (srow.penalties_attempted||0)
    ? `${srow.penalties_scored||0}/${srow.penalties_attempted}` : "—";
  const staleWarn = srow.value_is_stale
    ? ' <span class="warn" title="valuation more than a year old at season end">⚠</span>' : "";

  document.getElementById("main").innerHTML = `
  <div class="chips nums" id="chips">${chips}</div>
  <div class="duo">
    <div class="pcard">
      <div class="head">
        <div class="rating"><b class="nums">${m.pct[m.metric.key] ?? "—"}</b>
          <span>OUTPUT<br>PCT</span></div>
        <div class="idbox">
          <h1 class="disp">${esc(srow.player_name)}</h1>
          <p>${esc(srow.primary_position ?? "")} · ${esc(srow.team)} · ${esc(srow.league.split("-")[1] ?? srow.league)}
             · ${esc(srow.season)} · ${esc(srow.nationality ?? "")}${srow.age!=null ? " · age "+srow.age : ""}</p>
        </div>
      </div>
      <div class="verdict">
        <span class="chip" style="background:${m.verdict.color}">${m.verdict.chip}</span>
        <small>${m.verdict.gap!=null
          ? `output ${m.pct[m.metric.key]} pct vs value ${m.pct.market_value_in_eur} pct · gap ${m.verdict.gap>0?"+":""}${m.verdict.gap}`
          : ""}</small>
      </div>
      ${bar(m.metric.label, m.pct[m.metric.key], "var(--green)",
            m.metric.fmt(srow[m.metric.key]))}
      ${m.pct.npxga90!=null ? bar("npxG+xA /90", m.pct.npxga90, "var(--chalk-y)",
            m.me.npxga90.toFixed(2)) : ""}
      ${srow.primary_position === "GK" ? `
      ${bar("Clean sheet %", m.pct.clean_sheet_pct, "var(--green)",
            srow.clean_sheet_pct!=null ? srow.clean_sheet_pct.toFixed(1)+"%" : null)}
      ${bar("Conceded /90", m.pct.conceded, "var(--green)",
            m.me.conceded90!=null ? m.me.conceded90.toFixed(2) : null)}` : ""}
      ${bar("Availability", m.pct.minutes, "var(--blue)",
            Math.round(availability(srow)*100)+"%")}
      ${srow.primary_position === "GK" ? "" /* keepers never sub — share is always ~100% */ :
        bar("Start share", m.pct.start_share, "var(--blue)",
            m.me.start_share!=null ? Math.round(m.me.start_share*100)+"%" : null)}
      ${cardDots(srow)}
      ${bar("Value €", m.pct.market_value_in_eur, "var(--amber)", eur(srow.market_value_in_eur))}
      <div class="facts nums">
        <div><label>Minutes</label><b>${(srow.minutes??0).toLocaleString("en")}</b></div>
        <div><label>${srow.primary_position==="GK" ? "Saves · CS" : "G + A"}</label>
          <b>${srow.primary_position==="GK"
            ? `${srow.saves??"—"} · ${srow.clean_sheets??"—"}`
            : `${srow.goals??0} + ${srow.assists??0}`}</b></div>
        <div><label>Value</label><b>${eur(srow.market_value_in_eur)}${staleWarn}</b></div>
        <div><label>${esc(m.metric.label)}</label><b>${m.metric.fmt(srow[m.metric.key]) ?? "—"}</b></div>
        <div><label>npG − npxG</label><b>${m.overP!=null
          ? `<span style="color:${m.overP>0?"var(--green)":m.overP<0?"var(--red)":"inherit"}">${
              m.overP>0?"+":""}${m.overP.toFixed(1)}</span>` : "—"}</b></div>
        <div><label>Peers</label><b>${m.pool.length} ${esc(srow.primary_position ?? "")}</b></div>
      </div>
      <div class="facts nums">
        <div><label>Seasons</label><b>${seasons.length}</b></div>
        <div><label>Clubs</label><b>${clubs}</b></div>
        <div><label>Career G+A</label><b>${sum("goals")+sum("assists")}</b></div>
      </div>
      ${m.verdict.note ? `<p class="cardnote">${m.verdict.note}</p>` : ""}
      ${m.verdict.ceiling ? `<p class="cardnote">${m.verdict.ceiling}</p>` : ""}
      <p class="cardnote">Percentiles vs same position, league and season, ≥${MIN_MINUTES} min. Peak value ${eur(peakVal||null)}.</p>
    </div>

    <div class="panel">
      <div class="box">
        <h2>Value vs output — ${esc(srow.season)} ${esc(srow.league.split("-")[0])} ${esc(srow.primary_position ?? "")}
          <span class="plain">· hover any dot</span></h2>
        <div class="chartbox">${scatter(m)}</div>
        <p class="cap">Dashed diagonal = parity: production matches price. Above it = bargain zone,
           below = premium zone. Amber dot = ${esc(srow.player_name)}.</p>
      </div>
      <div class="box">
        <h2>${trendLines(m, typical).map(([,c,lab])=>
            `<span class="swatch" style="background:${c}"></span>${esc(lab)}`).join(" ")}
          <span class="plain">· career trend, hover for values</span></h2>
        <div class="chartbox">${trendChart(rows, trendLines(m, typical))}</div>
        <p class="cap">Typical value = same-position average at that age. Lines are shape-fitted
           to their own scale (different units) — real values in the tooltip.</p>
      </div>
      ${rows.some(r=>r.np_xg!=null) ? `
      <div class="box">
        <h2><span class="swatch" style="background:var(--green)"></span>npGoals
          <span class="swatch" style="background:var(--chalk-y)"></span>npxG
          <span class="plain">· finishing vs chance quality</span></h2>
        <div class="chartbox">${xgChart(rows)}</div>
        <p class="cap">Bars = non-penalty goals, line = the xG those chances were worth.
           Above the line is overperformance — real finishing skill takes several
           seasons to separate from luck, so read the run, not one bar.
           ${rows.some(r=>r.np_xg==null && +r.season >= 2014)
             ? "Seasons without a bar had no Understat match." : ""}</p>
      </div>` : ""}
    </div>
  </div>

  <section class="chart">
    <h2><span class="swatch" style="background:var(--amber)"></span>Market value by season
      <span style="color:var(--muted);letter-spacing:0;text-transform:none">· dashed = transfer · dotted = club change</span></h2>
    <div class="chartbox">${valueChart(rows, moves)}</div>
  </section>
  ${moves.length ? `
  <details class="season-log">
    <summary>Transfers (source coverage is partial — big historic moves can be missing)</summary>
    <div class="scroll">
    <table class="nums">
      <thead><tr><th>Date</th><th>From</th><th>To</th><th>Fee</th><th>Value then</th></tr></thead>
      <tbody>
      ${moves.slice().reverse().map(t=>`
        <tr>
          <td>${esc(t.transfer_date)}</td>
          <td>${esc(t.from_club_name ?? "—")}</td>
          <td>${esc(t.to_club_name ?? "—")}</td>
          <td>${t.transfer_fee ? eur(t.transfer_fee) : '<span class="dim">free / undisclosed</span>'}</td>
          <td>${eur(t.market_value_in_eur)}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    </div>
  </details>` : ""}
  <details class="season-log">
    <summary>Season log</summary>
    <div class="scroll">
    <table class="nums">
      <thead><tr><th>Season</th><th>League</th><th>Team</th><th>Min</th>
        <th>G</th><th>A</th><th>G+A /90</th><th>Value</th></tr></thead>
      <tbody>
      ${rows.slice().reverse().map(r=>`
        <tr>
          <td>${esc(r.season)}</td>
          <td class="dim">${esc(r.league.split("-")[0])}</td>
          <td>${esc(r.team)}</td>
          <td>${r.minutes ?? "—"}</td>
          <td>${r.goals ?? "—"}</td>
          <td>${r.assists ?? "—"}</td>
          <td>${r.goals_assists_per90 != null ? r.goals_assists_per90.toFixed(2)
               : '<span class="dim" title="under 450 minutes — rate not shown">—</span>'}</td>
          <td>${eur(r.market_value_in_eur)}${r.value_is_stale
               ? ' <span class="warn" title="valuation more than a year old at season end">⚠</span>' : ""}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    </div>
  </details>`;

  document.getElementById("chips").addEventListener("click", e => {
    const s = e.target.dataset?.s;
    if(!s) return;
    const u = new URL(location);
    u.searchParams.set("s", s);
    history.pushState({}, "", u);
    load();
  });
  wireTooltips(rows, m, typical);
}

/* ---------- value-vs-output scatter ---------- */
function scatter(m){
  const W=620, H=300, PL=44, PB=34, PT=14, PR=16;
  const px = p => PL + (W-PL-PR)*p/100;
  const py = p => H-PB - (H-PT-PB)*p/100;
  if(m.pool.length < 8 || m.pct[m.metric.key]==null)
    return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle"
      fill="var(--muted)" font-size="14">${m.pool.length < 8 ? "peer pool too small to rank" :
      `no ${m.metric.label} data for this season`}</text></svg>`;
  const vPct = pctsOf(m.pool, "market_value_in_eur");
  const oPct = pctsOf(m.pool, m.metric.key);
  const dots = m.pool.map((p,i)=>{
    const x = vPct(p.market_value_in_eur), y = oPct(p[m.metric.key]);
    if(x==null||y==null) return "";
    return `<circle data-p="${i}" cx="${px(x).toFixed(1)}" cy="${py(y).toFixed(1)}" r="4.5"
      fill="rgba(242,245,239,.30)"/>`;
  }).join("");
  const mx = m.pct.market_value_in_eur, my = m.pct[m.metric.key];
  const me = (mx!=null && my!=null) ?
    `<circle cx="${px(mx)}" cy="${py(my)}" r="8" fill="var(--amber)" stroke="var(--card)" stroke-width="2"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" id="schart" aria-label="Market value percentile vs output percentile among positional peers">
    <line x1="${PL}" y1="${py(0)}" x2="${px(100)}" y2="${py(100)}"
      stroke="var(--chalk-y)" stroke-opacity=".5" stroke-dasharray="5 5"/>
    <text x="${PL+8}" y="${PT+12}" fill="var(--axis)" font-size="11">bargain zone</text>
    <text x="${px(100)-104}" y="${py(0)-8}" fill="var(--axis)" font-size="11">premium zone</text>
    ${dots}${me}
    <line x1="${PL}" x2="${W-PR}" y1="${H-PB}" y2="${H-PB}" stroke="var(--axis)"/>
    <line x1="${PL}" x2="${PL}" y1="${PT}" y2="${H-PB}" stroke="var(--axis)"/>
    <text x="${PL}" y="${H-8}" fill="var(--axis)" font-size="11">market value percentile →</text>
    <text x="12" y="${H-PB}" fill="var(--axis)" font-size="11"
      transform="rotate(-90 12 ${H-PB})">${m.metric.label} percentile →</text>
  </svg>`;
}

/* ---------- career charts (shared x band scale) ---------- */
const W=720, PAD_L=52, PAD_R=14;
const bandX = (rows,i) => PAD_L + (W-PAD_L-PAD_R) * (i + .5) / rows.length;

function valueChart(rows, moves = []){
  const H=210, PT=14, PB=26;
  const seasonIdx = Object.fromEntries(rows.map((r,i)=>[r.season,i]));
  const recorded = new Set(moves.map(t=>seasonIdx[moveSeason(t.transfer_date)])
                                .filter(i=>i!=null));
  const vlines = moves.map(t=>{
    const i = seasonIdx[moveSeason(t.transfer_date)];
    if(i==null) return "";
    return `<line x1="${bandX(rows,i)}" x2="${bandX(rows,i)}" y1="${PT}" y2="${H-PB}"
      stroke="var(--line)" stroke-opacity=".35" stroke-dasharray="5 5">
      <title>${t.transfer_date}: ${t.from_club_name ?? "?"} → ${t.to_club_name ?? "?"}${t.transfer_fee ? " · "+eur(t.transfer_fee) : ""}</title></line>`;
  }).join("");

  // fallback: transfer records are patchy upstream, but the season log
  // itself shows the club changing — mark those moves too (dotted, no fee)
  const bySeason = new Map();
  rows.forEach((r,i)=>{
    if(!bySeason.has(r.season)) bySeason.set(r.season, {i, teams:new Set()});
    bySeason.get(r.season).teams.add(r.team);
  });
  const seasons = [...bySeason.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
  const synth = seasons.map(([s,cur],k)=>{
    if(!k) return "";
    const prev = seasons[k-1][1];
    const stayed = [...cur.teams].some(t=>prev.teams.has(t));
    if(stayed || recorded.has(cur.i)) return "";
    return `<line x1="${bandX(rows,cur.i)}" x2="${bandX(rows,cur.i)}" y1="${PT}" y2="${H-PB}"
      stroke="var(--line)" stroke-opacity=".25" stroke-dasharray="2 5">
      <title>${s}: ${[...prev.teams].join("/")} → ${[...cur.teams].join("/")} (no transfer record)</title></line>`;
  }).join("");
  const vals = rows.map(r=>r.market_value_in_eur);
  const max = Math.max(...vals.filter(v=>v!=null), 1);
  const y = v => PT + (H-PT-PB) * (1 - v/max);
  const pts = rows.map((r,i)=>vals[i]==null?null:[bandX(rows,i),y(vals[i])]);
  const seg=[]; let run=[];
  for(const p of pts){ if(p) run.push(p); else {if(run.length)seg.push(run); run=[];} }
  if(run.length) seg.push(run);
  const line = seg.map(s=>"M"+s.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ")).join(" ");
  const area = seg.map(s=>`M${s[0][0]} ${H-PB} L`+s.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ")
      +` L ${s[s.length-1][0]} ${H-PB} Z`).join(" ");
  const gridVals=[max, max/2];
  return `<svg viewBox="0 0 ${W} ${H}" id="vchart" aria-label="Market value by season">
    ${gridVals.map(g=>`<line x1="${PAD_L}" x2="${W-PAD_R}" y1="${y(g)}" y2="${y(g)}"
        stroke="var(--grid)"/><text x="${PAD_L-6}" y="${y(g)+4}" text-anchor="end"
        font-size="11" fill="var(--axis)">${eur(g)}</text>`).join("")}
    <line x1="${PAD_L}" x2="${W-PAD_R}" y1="${H-PB}" y2="${H-PB}" stroke="var(--axis)"/>
    ${vlines}${synth}
    <path d="${area}" fill="var(--amber)" opacity=".14"/>
    <path d="${line}" fill="none" stroke="var(--amber)" stroke-width="2"/>
    ${pts.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--amber)"
        stroke="var(--card)" stroke-width="2"/>`:"").join("")}
    ${xAxis(rows,H,PB)}
    <line id="vcross" y1="${PT}" y2="${H-PB}" stroke="var(--axis)" stroke-dasharray="3 3"
        visibility="hidden"/>
  </svg>`;
}

// a trend-line key is either a row field name or an accessor function
// (the age-curve line has no column — it looks up the per-age average)
const asGetter = key => typeof key === "function" ? key : (r => r[key]);

// npGoals bars vs npxG line — shared count axis, so the gap IS the finishing
function xgChart(rows){
  const H=170, PT=14, PB=26;
  const g  = rows.map(r=>r.np_xg==null ? null : (r.non_penalty_goals ?? 0));
  const xg = rows.map(r=>r.np_xg);
  const max = Math.max(...[...g, ...xg].filter(v=>v!=null), 1);
  const y = v => H-PB-(H-PT-PB)*(v/max);
  const bw = Math.min(24,(W-PAD_L-PAD_R)/rows.length-2);
  const bars = rows.map((r,i)=> g[i]==null ? "" : `
    <rect x="${(bandX(rows,i)-bw/2).toFixed(1)}" y="${y(g[i]).toFixed(1)}"
      width="${bw.toFixed(1)}" height="${Math.max(H-PB-y(g[i]),1).toFixed(1)}"
      rx="3" fill="var(--green)" opacity=".85"/>`).join("");
  const pts = rows.map((r,i)=>xg[i]==null?null:[bandX(rows,i), y(xg[i])]);
  const seg=[]; let run=[];
  for(const p of pts){ if(p) run.push(p); else {if(run.length>1)seg.push(run); run=[];} }
  if(run.length>1) seg.push(run);
  const line = seg.map(s=>`<path fill="none" stroke="var(--chalk-y)" stroke-width="2"
    d="M${s.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ")}"/>`).join("");
  const dots = pts.map(p=>p?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}"
    r="3" fill="var(--chalk-y)"/>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" id="xchart" aria-label="Non-penalty goals versus expected goals by season">
    <line x1="${PAD_L}" x2="${W-PAD_R}" y1="${H-PB}" y2="${H-PB}" stroke="var(--axis)"/>
    <text x="${PAD_L-6}" y="${PT+8}" text-anchor="end" font-size="11" fill="var(--axis)">${Math.round(max)}</text>
    ${bars}${line}${dots}
    ${xAxis(rows,H,PB)}
    <line id="xcross" y1="${PT}" y2="${H-PB}" stroke="var(--axis)" stroke-dasharray="3 3"
        visibility="hidden"/>
  </svg>`;
}

// position-aware line set shared by the trend chart, its legend and tooltip
const trendLines = (m, typical = {}) => [
  ["minutes", "var(--blue)", "Minutes", v=>v ?? "—"],
  [r => r.age!=null ? typical[r.age] : null, "var(--chalk-y)", "Typical value",
    v=>v!=null ? eur(v) : "—"],
  [m.metric.key, "var(--green)", m.metric.label, v=>m.metric.fmt(v) ?? "—"],
];

// shape-fitted lines (units differ — no shared axis; real values in tooltip)
function trendChart(rows, lines){
  const H=150, PT=12, PB=24;
  const line = (vals, color) => {
    const vmax = Math.max(...vals.filter(v=>v!=null), 1e-9);
    const pts = vals.map((v,i)=>v==null?null:
      [bandX(rows,i), H-PB-(H-PT-PB)*.92*(v/vmax)]);
    const seg=[]; let run=[];
    for(const p of pts){ if(p) run.push(p); else {if(run.length>1)seg.push(run); run=[];} }
    if(run.length>1) seg.push(run);
    return seg.map(s=>`<path fill="none" stroke="${color}" stroke-width="2"
      d="M${s.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ")}"/>`).join("");
  };
  return `<svg viewBox="0 0 ${W} ${H}" id="tchart" aria-label="Career trend lines">
    <line x1="${PAD_L}" x2="${W-PAD_R}" y1="${H-PB}" y2="${H-PB}" stroke="var(--axis)"/>
    ${lines.map(([key,color])=>line(rows.map(asGetter(key)), color)).join("")}
    ${xAxis(rows,H,PB)}
    <line id="tcross" y1="${PT}" y2="${H-PB}" stroke="var(--axis)" stroke-dasharray="3 3"
        visibility="hidden"/>
  </svg>`;
}

function xAxis(rows,H,PB){
  const step = Math.ceil(rows.length/9);
  return rows.map((r,i)=> i%step ? "" :
    `<text x="${bandX(rows,i)}" y="${H-PB+16}" text-anchor="middle" font-size="11"
      fill="var(--axis)">'${r.season.slice(2)}</text>`).join("");
}

/* ---------- hover layer ---------- */
function wireTooltips(rows, m, typical = {}){
  const tip = document.getElementById("tip");
  const show = (e,html) => { tip.innerHTML = html; tip.style.display = "block";
    tip.style.left = Math.min(e.clientX+14, innerWidth-190)+"px";
    tip.style.top = (e.clientY+14)+"px"; };
  const hide = () => tip.style.display = "none";

  const s = document.getElementById("schart");
  if(s) s.addEventListener("mousemove", e => {
    const c = e.target.closest("circle[data-p]");
    if(!c){ hide(); return; }
    const p = m.pool[+c.dataset.p];
    show(e, `<div class="t">${esc(p.player_name)} · ${esc(p.team)}</div>
      ${m.metric.fmt(p[m.metric.key]) ?? "—"} ${esc(m.metric.label)} · ${eur(p.market_value_in_eur)}
      · ${p.minutes} min`);
  });
  if(s) s.addEventListener("mouseleave", hide);

  const v = document.getElementById("vchart"), cross = document.getElementById("vcross");
  const idxFromEvent = (svg,e) => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX-r.left)/r.width*W;
    return Math.max(0, Math.min(rows.length-1,
      Math.floor((x-PAD_L)/(W-PAD_L-PAD_R)*rows.length)));
  };
  v.addEventListener("mousemove", e => {
    const i = idxFromEvent(v,e), r = rows[i];
    cross.setAttribute("x1",bandX(rows,i)); cross.setAttribute("x2",bandX(rows,i));
    cross.setAttribute("visibility","visible");
    show(e, `<div class="t">${esc(r.season)} · ${esc(r.team)}</div>
      ${eur(r.market_value_in_eur)}${r.value_is_stale?" ⚠":""}`);
  });
  v.addEventListener("mouseleave", () => { hide(); cross.setAttribute("visibility","hidden"); });

  const xc = document.getElementById("xchart");
  if(xc){
    const xcross = document.getElementById("xcross");
    xc.addEventListener("mousemove", e => {
      const i = idxFromEvent(xc,e), r = rows[i];
      xcross.setAttribute("x1",bandX(rows,i)); xcross.setAttribute("x2",bandX(rows,i));
      xcross.setAttribute("visibility","visible");
      const d = r.np_xg!=null ? (r.non_penalty_goals ?? 0) - r.np_xg : null;
      show(e, `<div class="t">${esc(r.season)} · ${esc(r.team)}</div>
        ${r.np_xg!=null
          ? `${r.non_penalty_goals ?? 0} npG vs ${r.np_xg.toFixed(1)} npxG<br>
             ${d>0?"+":""}${d.toFixed(1)} ${d>0?"over":"under"}performance`
          : "no xG data this season"}`);
    });
    xc.addEventListener("mouseleave", () => {
      hide(); xcross.setAttribute("visibility","hidden"); });
  }

  const t = document.getElementById("tchart"), tc = document.getElementById("tcross");
  const tl = trendLines(m, typical);
  t.addEventListener("mousemove", e => {
    const i = idxFromEvent(t,e), r = rows[i];
    tc.setAttribute("x1",bandX(rows,i)); tc.setAttribute("x2",bandX(rows,i));
    tc.setAttribute("visibility","visible");
    show(e, `<div class="t">${esc(r.season)} · ${esc(r.team)}</div>
      ${tl.map(([key,,lab,fmt])=>`${fmt(asGetter(key)(r))} ${esc(lab)}`).join(" · ")}`);
  });
  t.addEventListener("mouseleave", () => { hide(); tc.setAttribute("visibility","hidden"); });
}
</script>
</body>
</html>
